/* backup key -> IndexedDB store */
const BACKUP_MAP = {profile:'profile', settings:'settings', bodyMeasurements:'bodyMeasurements', wellness:'wellnessEntries', steps:'stepEntries',
  workouts:'workouts', exercises:'workoutExercises', sets:'sets', customExercises:'customExercises', templates:'workoutTemplates', foods:'foods',
  customFoods:'customFoods', recipes:'recipes', nutrition:'nutritionEntries', goals:'goals', personalRecords:'personalRecords', dayNotes:'dayNotes'};
const BACKUP_LABELS = {profile:'Profile', settings:'Settings', bodyMeasurements:'Body entries', wellness:'Sleep & wellness', steps:'Step days', workouts:'Workouts & sessions',
  exercises:'Workout exercises', sets:'Sets', customExercises:'Custom exercises', templates:'Templates', foods:'Imported foods', customFoods:'Custom foods', recipes:'Saved meals',
  nutrition:'Food entries', goals:'Goals', personalRecords:'Personal records', dayNotes:'Day notes'};
function buildBackup(){
  const b = {schemaVersion:APP.schemaVersion, app:APP.name, appVersion:APP.version, exportDate:nowISO()};
  for (const [k, s] of Object.entries(BACKUP_MAP)) b[k] = k === 'foods' ? DB.all(s).filter(f => f.imported) : DB.all(s);
  b.libraryFavorites = {exercises:DB.all('exerciseLibrary').filter(x => x.favorite).map(x => x.id), foods:DB.all('foods').filter(x => x.favorite && !x.imported).map(x => x.id)};
  return b;
}
async function shareOrDownload(filename, text, mime){
  const blob = new Blob([text], {type:mime});
  try {
    const file = new File([blob], filename, {type:mime});
    if (navigator.canShare && navigator.canShare({files:[file]}) && /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)){
      await navigator.share({files:[file], title:filename}); return true; }
  } catch(e){ if (e && e.name === 'AbortError') return false; }
  const url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000); return true;
}
async function exportBackup(){
  const b = buildBackup(), n = Object.keys(BACKUP_MAP).reduce((t, k) => t + b[k].length, 0);
  const ok = await shareOrDownload(`fitness-backup-${todayKey()}.json`, JSON.stringify(b, null, 1), 'application/json');
  if (ok){ await DB.put('appMetadata', {id:'lastBackup', at:nowISO(), records:n}); render(); toast(`Backup created · ${fmtN(n)} records`); }
}
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
function validateRecord(key, r){
  if (!r || typeof r !== 'object' || Array.isArray(r) || typeof r.id !== 'string' || !r.id || r.id.length > 200) return false;
  const numOk = (v, lo, hi) => v === null || v === undefined || (typeof v === 'number' && Number.isFinite(v) && v >= lo && v <= hi);
  const dated = ['bodyMeasurements','wellness','steps','workouts','nutrition','personalRecords'];
  if (dated.includes(key) && !(typeof r.date === 'string' && DATE_RE.test(r.date))) return false;
  if (key === 'bodyMeasurements') return numOk(r.weightKg, 20, 500) && numOk(r.bodyFat, 1, 80);
  if (key === 'steps') return numOk(r.steps, 0, 300000);
  if (key === 'wellness') return numOk(r.sleepHours, 0, 24);
  if (key === 'workouts') return typeof r.type === 'string' && WORKOUT_TYPES[r.type] !== undefined && numOk(r.durationMin, 0, 24*60);
  if (key === 'sets') return typeof r.workoutId === 'string' && typeof r.exerciseId === 'string' && numOk(r.weightKg, 0, 2000) && numOk(r.reps, 0, 10000);
  if (key === 'exercises') return typeof r.workoutId === 'string' && typeof r.exerciseId === 'string';
  if (key === 'nutrition') return typeof r.name === 'string' && numOk(r.quantity, 0, 1000) && numOk(r.calories, 0, 100000);
  if (key === 'customFoods' || key === 'foods') return typeof r.name === 'string' && numOk(r.calories, 0, 100000);
  if (key === 'customExercises') return typeof r.name === 'string' && typeof r.trackingType === 'string';
  if (key === 'templates') return typeof r.name === 'string' && Array.isArray(r.exercises);
  if (key === 'recipes') return typeof r.name === 'string' && Array.isArray(r.ingredients);
  return true;
}
function parseBackup(text){
  let data; try { data = JSON.parse(text); } catch(e){ throw new Error('This file isn’t valid JSON. Choose a backup file created by this app.'); }
  if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('This file isn’t a backup created by this app.');
  if (!Number.isFinite(data.schemaVersion)) throw new Error('This file is missing a schema version, so it doesn’t look like a backup from this app.');
  if (data.schemaVersion > APP.schemaVersion) throw new Error('This backup was made by a newer version of the app. Update the app, then import again.');
  const known = Object.keys(BACKUP_MAP).filter(k => k in data);
  if (!known.length) throw new Error('This backup doesn’t contain any records.');
  const clean = {}, counts = {}, rejected = {};
  for (const k of Object.keys(BACKUP_MAP)){
    let list = data[k]; if (list === undefined || list === null) { clean[k] = []; continue; }
    if (!Array.isArray(list)) list = typeof list === 'object' ? [list] : null;
    if (!list) throw new Error(`The “${k}” section of this backup is damaged.`);
    const good = list.filter(r => validateRecord(k, r));
    clean[k] = good.map(r => JSON.parse(JSON.stringify(r))); counts[k] = good.length; if (list.length - good.length) rejected[k] = list.length - good.length;
  }
  return {data:clean, counts, rejected, exportDate:data.exportDate, favorites:data.libraryFavorites || {exercises:[], foods:[]}};
}
function openImportPreview(parsed){
  const total = Object.values(parsed.counts).reduce((a, b) => a + b, 0), rej = Object.values(parsed.rejected).reduce((a, b) => a + b, 0);
  const s = openSheet({title:'Import Backup', left:cancelBtn(), full:true,
    body:`<div class="card"><div class="stat"><div class="v" style="font-size:20px">${parsed.exportDate ? esc(new Date(parsed.exportDate).toLocaleString()) : 'Unknown date'}</div><div class="l">Backup date</div></div></div>
      <div class="listhead">Records in this backup</div>
      <div class="list">${Object.entries(parsed.counts).filter(([, n]) => n).map(([k, n]) => `<div class="row"><span class="grow">${esc(BACKUP_LABELS[k])}</span><span class="val">${fmtN(n)}</span></div>`).join('')
        || '<div class="row"><span class="grow muted">No records</span></div>'}</div>
      ${rej ? `<p class="listfoot" style="color:var(--warn)">${fmtN(rej)} damaged or invalid record${rej === 1 ? '' : 's'} will be skipped.</p>` : ''}
      <div class="listhead">How should this backup be imported?</div>
      <div class="list"><button class="row" data-a="merge" data-once><span class="grow"><span class="title" style="font-weight:600;color:var(--accent)">Merge with existing data</span>
        <span class="meta" style="white-space:normal">Adds records you don’t have. When the same record exists in both, the more recently edited version is kept.</span></span></button>
      <button class="row" data-a="replace" data-once><span class="grow"><span class="title" style="font-weight:600;color:var(--bad)">Replace existing data</span>
        <span class="meta" style="white-space:normal">Deletes everything currently in the app, then restores this backup.</span></span></button></div>
      <p class="listfoot">Tip: export a backup of your current data first if you might want it later.</p>`,
    actions:{cancel:() => s.close(),
      merge: async () => { if (!total) return toast('Nothing to import'); const r = await importBackup(parsed, 'merge'); s.close();
        dialog({title:'Import complete', message:`${fmtN(r.added)} added · ${fmtN(r.updated)} updated from backup · ${fmtN(r.kept)} already up to date.`}); },
      replace: async () => {
        const ok = await confirmDialog('Replace all data?', 'Everything currently stored in the app will be deleted and replaced with this backup. This can’t be undone.', 'Replace');
        if (!ok) return; const r = await importBackup(parsed, 'replace'); s.close(); dialog({title:'Backup restored', message:`${fmtN(r.added)} records restored.`}); }}});
}
async function importBackup(parsed, mode){
  const res = {added:0, updated:0, kept:0};
  try {
    if (mode === 'replace'){
      for (const [k, st] of Object.entries(BACKUP_MAP)){
        if (st === 'foods'){ await DB.delMany('foods', DB.all('foods').filter(f => f.imported).map(f => f.id)); continue; }
        await DB.clear(st); }
    }
    for (const [k, st] of Object.entries(BACKUP_MAP)){
      if (k === 'personalRecords') continue; /* derived: rebuilt below */
      const incoming = parsed.data[k] || [], write = [];
      for (const r of incoming){
        if (k === 'foods'){ r.imported = true; r.custom = false; }
        const cur = DB.get(st, r.id);
        if (!cur){ write.push(r); res.added++; }
        else if ((r.updatedAt || '') > (cur.updatedAt || '')){ write.push(r); res.updated++; }
        else res.kept++;
      }
      write.forEach(r => r._keepUpdated = true);
      for (let i = 0; i < write.length; i += 500) await DB.putMany(st, write.slice(i, i + 500));
    }
    /* favorites of built-in library items */
    const favEx = (parsed.favorites.exercises || []).map(id => DB.get('exerciseLibrary', id)).filter(x => x && !x.favorite).map(x => Object.assign({}, x, {favorite:true}));
    const favF = (parsed.favorites.foods || []).map(id => DB.get('foods', id)).filter(x => x && !x.favorite).map(x => Object.assign({}, x, {favorite:true}));
    await DB.putMany('exerciseLibrary', favEx); await DB.putMany('foods', favF);
    /* only one workout may be in progress */
    const active = DB.all('workouts').filter(w => w.status === 'active').sort((a, b) => (b.startTime || '').localeCompare(a.startTime || ''));
    if (active.length > 1){ const fix = active.slice(1).map(w => Object.assign({}, w, {status:'done', endTime:w.endTime || w.startTime, durationMin:w.durationMin || 0})); await DB.putMany('workouts', fix); }
    await rebuildPRs();
    if (!DB.get('goals', 'main')) await DB.put('goals', {id:'main', calories:2200, protein:150, carbs:220, fat:70, steps:8000, weeklyWorkouts:4});
    if (!DB.get('settings', 'main')) await DB.put('settings', {id:'main', units:'us', appearance:'system', restDefault:90, autoRest:true, mealNames:['Breakfast','Lunch','Dinner','Snacks']});
    if (DB.get('profile', 'main') && !DB.get('appMetadata', 'onboarding')) await DB.put('appMetadata', {id:'onboarding', completedAt:nowISO()});
  } catch(e){ showError('Import stopped', e); throw e; }
  applyTheme(); requestPersistence();
  if (!DB.get('profile', 'main')){ $('#tabbar').classList.add('hidden'); $$('.view').forEach(v => v.classList.remove('active')); renderOnboarding(); }
  else refresh();
  return res;
}
function chooseImportFile(){
  const inp = $('#import-file'); inp.value = '';

    try { const parsed = parseBackup(await f.text()); openImportPreview(parsed); } catch(e){ showError('Can’t import this file', e); } };

  const plans = [
    {name:'Push', ex:[['Barbell Bench Press', 84, 8], ['Overhead Press', 50, 8], ['Incline Dumbbell Press', 30, 10], ['Dumbbell Lateral Raise', 10, 14], ['Cable Triceps Pushdown', 27, 12]]},
    {name:'Pull', ex:[['Deadlift', 140, 5], ['Barbell Row', 70, 8], ['Lat Pulldown', 59, 10], ['Face Pull', 20, 15], ['Barbell Curl', 30, 10]]},
    {name:'Legs', ex:[['Back Squat', 110, 6], ['Romanian Deadlift', 90, 8], ['Leg Press', 180, 12], ['Lying Leg Curl', 41, 12], ['Standing Calf Raise', 70, 12]]}];
  const meals = [
    ['Breakfast', [['Oats, rolled', 1], ['Banana', 1], ['Whey Protein', 1], ['Milk, 2%', 1]]], ['Breakfast', [['Egg, whole', 3], ['Whole Wheat Bread', 2], ['Strawberries', 1]]],
    ['Lunch', [['Chicken Breast', 1.5], ['White Rice', 1], ['Broccoli', 1], ['Olive Oil', 0.5]]], ['Lunch', [['Ground Beef 90/10', 1], ['Flour Tortilla', 2], ['Black Beans', 0.5], ['Salsa', 1], ['Cheddar Cheese', 1]]],
    ['Dinner', [['Salmon, Atlantic farmed', 1.5], ['Sweet Potato', 1], ['Mixed Vegetables', 1]]], ['Dinner', [['Steak, top sirloin', 1.5], ['White Potato', 1], ['Green Beans', 1], ['Butter', 1]]],
    ['Snacks', [['Greek Yogurt, plain, nonfat', 1], ['Blueberries', 1]]], ['Snacks', [['Almonds', 1], ['Apple', 1]]]];
  const mealNm = mealNames(), mapMeal = m => mealNm[['Breakfast','Lunch','Dinner','Snacks'].indexOf(m)] || mealNm[0];
  let planIdx = 0, weight = 95.5, bf = 19.4;
  for (let i = 29; i >= 0; i--){
    const d = addDays(t, -i), day = parseKey(d).getDay();
    weight += -0.065 + jitter(0.05); const wToday = weight + jitter(0.45);
    if (rnd() < 0.9) push('bodyMeasurements', {id:uid('b-'), date:d, time:combineDT(d, '07:1' + Math.floor(rnd()*9)), weightKg:round(wToday, 2), bodyFat:(i % 3 === 0) ? round(bf - (29 - i) * 0.03 + jitter(0.4), 1) : null,
      conditions:['Morning','Fasted','After Bathroom'], notes:'', measurements: i % 14 === 0 ? {waist:round(92 - (29 - i) * 0.04, 1), chest:108, neck:40.5, leftArm:38.5, rightArm:38.8} : {}});
    if (!I.stepsByDate.has(d)) push('stepEntries', {id:uid('st-'), date:d, steps:Math.round(7000 + rnd() * 6500 + (day === 0 || day === 6 ? 1500 : 0))});
    if (!I.wellByDate.has(d)) push('wellnessEntries', {id:uid('wl-'), date:d, sleepHours:round(6.4 + rnd() * 1.8, 1), readiness:2 + Math.floor(rnd() * 4), energy:2 + Math.floor(rnd() * 4),
      soreness:1 + Math.floor(rnd() * 3), stress:1 + Math.floor(rnd() * 3), sleepQuality:2 + Math.floor(rnd() * 4), notes:''});
    if (i > 0 || new Date().getHours() >= 12){
      const pick = [meals[rnd() < 0.5 ? 0 : 1], meals[rnd() < 0.5 ? 2 : 3], meals[rnd() < 0.5 ? 4 : 5]].concat(rnd() < 0.7 ? [meals[rnd() < 0.5 ? 6 : 7]] : []);
      let n = 0;
      for (const [meal, items] of pick){ for (const [fname, q] of items){ const f = fd(fname); if (!f) continue;
        push('nutritionEntries', Object.assign({id:uid('n-'), date:d, meal:mapMeal(meal), quantity:q, createdAt:new Date(parseKey(d).getTime() + 8*3600000 + (n++)*60000).toISOString()}, snapshotFrom(Object.assign({kind:'food'}, f)))); } }
    }
    /* training: Mon/Wed/Fri/Sat lifting, Tue/Thu cardio, Sun off */
    if ([1,3,5,6].includes(day) && i > 0){
      const plan = plans[planIdx++ % 3], prog = (29 - i) / 29, start = new Date(parseKey(d)); start.setHours(17, 5 + Math.floor(rnd()*20), 0, 0);
      const dur = 62 + Math.floor(rnd() * 25), w = {id:uid('w-'), date:d, type:'strength', name:plan.name, startTime:start.toISOString(), endTime:new Date(start.getTime() + dur*60000).toISOString(),
        durationMin:dur, status:'done', notes:'', met:STRENGTH_MET};
      w.calories = workoutCalories(w, wToday); push('workouts', w);
      plan.ex.forEach(([exName, kg, reps], order) => { const id = exId(exName); if (!id) return;
        const we = {id:uid('we-'), workoutId:w.id, exerciseId:id, order, groupId:null, notes:''}; push('workoutExercises', we);
        const plate = U.us ? 5 * KG_PER_LB : 2.5, rnd5 = v => Math.round(v / plate) * plate, load = rnd5(kg * (1 + prog * 0.06)), sets = [];
        if (order === 0) sets.push({type:'warmup', weightKg:rnd5(load * 0.6), reps:8});
        for (let k = 0; k < 3; k++) sets.push({type:'working', weightKg:load, reps:Math.max(1, reps - (k === 2 && rnd() < 0.5 ? 1 : 0) + (prog > 0.6 && k === 0 ? 1 : 0))});
        sets.forEach((s, j) => push('sets', {id:uid('s-'), workoutId:w.id, workoutExerciseId:we.id, exerciseId:id, order:j, type:s.type, weightKg:s.weightKg, reps:s.reps,
          durationSec:null, distanceKm:null, rir:s.type === 'working' ? 1 + Math.floor(rnd() * 3) : null, rpe:null, completed:true, completedAt:w.endTime})); });
    } else if ([2,4].includes(day) && i > 0){
      const start = new Date(parseKey(d)); start.setHours(6, 30, 0, 0); const dur = 28 + Math.floor(rnd() * 15), run = day === 2;
      const w = {id:uid('w-'), date:d, type:'cardio', activity:run ? 'Running' : 'Stationary Bike', name:'', startTime:start.toISOString(), endTime:new Date(start.getTime() + dur*60000).toISOString(),
        durationMin:dur, status:'done', intensity:'moderate', met:run ? 9.8 : 6.8, distanceKm:run ? round(dur / 6.1, 2) : round(dur / 2.3, 2), avgHr:138 + Math.floor(rnd() * 20), notes:''};
      w.calories = workoutCalories(w, wToday); push('workouts', w);
    }
  }
  try {
    for (const s of DEMO_STORES) for (let i = 0; i < out[s].length; i += 500) await DB.putMany(s, out[s].slice(i, i + 500));
    await rebuildPRs();
  } catch(e){ showError('Could not load demo data', e); return; }
  refresh(); toast('Demo data loaded (marked as Sample)');
}
async function removeDemoData(){
  const n = countDemo(); if (!n) return toast('No demo data');
  if (!(await confirmDialog('Remove demo data?', `${fmtN(n)} sample records will be deleted. Your own entries are not affected.`, 'Remove'))) return;
  const demoW = new Set(DB.all('workouts').filter(w => w.demo).map(w => w.id));
  for (const s of DEMO_STORES){ const ids = DB.all(s).filter(r => r.demo || (r.workoutId && demoW.has(r.workoutId))).map(r => r.id); await DB.delMany(s, ids); }
  await rebuildPRs(); refresh(); toast('Demo data removed');
}

/* ---------- reset (warning → confirmation → type RESET) ---------- */
async function resetApp(){
  const a = await dialog({title:'Reset application data?', message:'This permanently deletes <b>all</b> of your workouts, body entries, food logs, custom foods and exercises, templates, goals, and settings on this device.<br><br>Export a backup first if you might want this data later.',
    buttons:[{label:'Cancel', value:false}, {label:'Export backup', value:'backup'}, {label:'Continue', value:true, cls:'danger'}]});
  if (a === 'backup'){ exportBackup(); return; } if (a !== true) return;
  const b = await confirmDialog('Are you absolutely sure?', 'Deleted data cannot be recovered.', 'Yes, continue');
  if (!b) return;
  const typed = await dialog({title:'Type RESET to confirm', message:'This is the last step.', input:{placeholder:'RESET'}, buttons:[{label:'Cancel', value:false}, {label:'Delete everything', value:true, cls:'danger'}]});
  if (typed === false) return;
  if (String(typed).trim() !== 'RESET') return dialog({title:'Nothing was deleted', message:'The text didn’t match RESET, so your data is unchanged.'});
  try {
    for (const s of STORES) await DB.clear(s);
    try { localStorage.removeItem('ct-rest'); } catch(e){}
    REST.running = false; LIVE_PR.clear();
    await seedLibraries();
  } catch(e){ return showError('Reset failed', e); }
  while (SHEETS.length) topSheet().close();
  STATE.tab = 'today'; STATE.metric = 'weight'; STATE.nutritionDate = todayKey();
  $('#tabbar').classList.add('hidden'); $$('.view').forEach(v => { v.classList.remove('active'); v.innerHTML = ''; }); applyTheme();
  renderOnboarding(); toast('All data deleted');
}

/* ==========================================================
   EVENT HANDLERS  (event delegation for all main views)
   ========================================================== */
function openAddWorkoutMenu(){
  const active = DB.all('workouts').find(w => w.status === 'active');
  if (active) return openWorkoutEditor(active.id);
  const s = openSheet({title:'Add Workout', left:cancelBtn(), actions:{cancel:() => s.close(),
      repeat:() => { s.close(); repeatWorkoutPicker(); }, empty:() => { s.close(); startEmpty(); }, tmpl:() => { s.close(); openTemplates(); },
      session: a => { s.close(); openSessionSheet(a.dataset.type); }},
    body:`<div class="list"><button class="row" data-a="repeat">${ICON.repeat}<span class="grow"><span class="title">Repeat previous workout</span><span class="meta">Loads your last exercises and sets</span></span>${ICON.chev}</button>
      <button class="row" data-a="tmpl">${ICON.list}<span class="grow"><span class="title">Start from template</span></span>${ICON.chev}</button>
      <button class="row" data-a="empty">${ICON.plus}<span class="grow"><span class="title">Empty weight workout</span></span>${ICON.chev}</button></div>
      <div class="list"><button class="row" data-a="session" data-type="cardio">${ICON.run}<span class="grow"><span class="title">Cardio</span></span>${ICON.chev}</button>
      <button class="row" data-a="session" data-type="sport">${ICON.ball}<span class="grow"><span class="title">Sports / athletic training</span></span>${ICON.chev}</button>
      <button class="row" data-a="session" data-type="mobility">${ICON.stretch}<span class="grow"><span class="title">Mobility / recovery</span></span>${ICON.chev}</button></div>`});
  $$('.row svg:not(.chev)', s.el).forEach(svg => { svg.setAttribute('width', 24); svg.setAttribute('height', 24); svg.style.color = 'var(--accent)'; svg.style.flex = 'none'; });
}
function openDatePicker(){
  const s = openSheet({title:'Go to Date', left:cancelBtn(), right:saveBtn('Go'),
    body:`<label class="field"><span>Date</span><input class="input" type="date" name="d" value="${STATE.nutritionDate}" max="${todayKey()}"></label>
      <button class="btn block" data-a="today">Today</button>`,
    actions:{cancel:() => s.close(), today:() => { STATE.nutritionDate = todayKey(); s.close(); render(); },
      save:() => { const d = formVals(s.el).d; if (!DATE_RE.test(d)) return toast('Choose a date'); STATE.nutritionDate = d > todayKey() ? todayKey() : d; s.close(); render(); }}});
}
const ACTIONS = {
  'resume-workout':() => { const a = DB.all('workouts').find(w => w.status === 'active'); if (a) openWorkoutEditor(a.id); else refresh(); },
  'add-weight':() => openBodySheet(),
  'add-workout':() => openAddWorkoutMenu(),
  'add-food': el => openFoodSearch({meal:el.dataset.meal || defaultMeal(), date:STATE.tab === 'nutrition' ? STATE.nutritionDate : todayKey()}),
  'add-steps':() => openStepsSheet(),
  'add-wellness':() => openWellnessSheet(),
  'goto-metric': el => { STATE.metric = el.dataset.metric; setTab('progress'); },
  'goto': el => setTab(el.dataset.tab),
  'energy-info': el => openEnergyInfo(el.dataset.date || todayKey()),
  'open-workout': el => { const w = DB.get('workouts', el.dataset.id); if (!w) return toast('Workout not found'); if (w.type === 'strength') openWorkoutEditor(w.id); else openSessionSheet(w.type, w); },
  'day-note': el => openDayNote(el.dataset.date || todayKey()),
  'start-empty':() => startEmpty(), 'start-template':() => openTemplates(), 'repeat-workout':() => repeatWorkoutPicker(),
  'session': el => openSessionSheet(el.dataset.type), 'templates':() => openTemplates(),
  'exercise-library':() => openExercisePicker({manage:true}),
  'more-history':() => { STATE.historyLimit += 20; render(); },
  'food-manage':() => openFoodSearch({mode:'manage'}),
  'nday': el => { const d = addDays(STATE.nutritionDate, Number(el.dataset.d)); if (d > todayKey()) return; STATE.nutritionDate = d; render(); },
  'nday-pick':() => openDatePicker(),
  'edit-entry': el => openEntryEditor(el.dataset.id),
  'copy-meal': el => copyMeal(el.dataset.meal),
  'pick-metric':() => openMetricPicker(),
  'exercise-progress': el => openExerciseProgress(el.dataset.id),
  'exercise-all':() => openExercisePicker({onPick: ex => openExerciseProgress(ex.id)}),
  'edit-goals':() => openGoalsSheet(),
  'add-measure':() => openBodySheet(null, {measure:true}),
  'more-body':() => { STATE.bodyLimit += 20; render(); },
  'body-entry': el => { const b = DB.get('bodyMeasurements', el.dataset.id); if (b) openBodySheet(b, {measure:Object.values(b.measurements || {}).some(Number.isFinite)}); },
  'profile':() => openProfileSheet(), 'meal-names':() => openMealNames(),
  'export-json':() => exportBackup(), 'import-json':() => chooseImportFile(), 'csv':() => openCSVSheet(), 'import-foods':() => chooseFoodImportFile(),
  'demo-load':() => loadDemoData(), 'demo-remove':() => removeDemoData(), 'persist':() => openStorageInfo(), 'reset':() => resetApp()
};
$('#app').addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act]; if (!fn) return;
  e.preventDefault();
  if (el.dataset.busy) return; el.dataset.busy = '1';
  try { await fn(el, e); } catch(err){ showError('Something went wrong', err); } finally { delete el.dataset.busy; }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && DB.db && !$('#tabbar').classList.contains('hidden')){ REST.tick(); if (!SHEETS.length) render(); } });

/* ==========================================================
   LIBRARY SEEDING  (built-in exercises + foods; preserves favorites)
   ========================================================== */
async function seedLibraries(){
  const meta = DB.get('appMetadata', 'library');
  const exs = buildExerciseLibrary(), foods = buildFoodLibrary();
  const needEx = !meta || meta.version !== APP.libraryVersion || DB.all('exerciseLibrary').length !== exs.length;
  const needF = !meta || meta.version !== APP.libraryVersion || DB.all('foods').filter(f => !f.imported).length !== foods.length;
  if (needEx){ for (const e of exs){ const cur = DB.get('exerciseLibrary', e.id); if (cur){ e.favorite = !!cur.favorite; e.createdAt = cur.createdAt; } } await DB.putMany('exerciseLibrary', exs); }
  if (needF){ for (const f of foods){ const cur = DB.get('foods', f.id); if (cur){ f.favorite = !!cur.favorite; f.createdAt = cur.createdAt; } } await DB.putMany('foods', foods); }
  if (needEx || needF) await DB.put('appMetadata', {id:'library', version:APP.libraryVersion, exercises:exs.length, foods:foods.length});
}

/* ==========================================================
   INITIALIZATION
   ========================================================== */
let appStarted = false, tickTimer = null;
function startApp(){
  $('#boot').classList.add('hidden'); $('#onboarding').classList.add('hidden'); $('#tabbar').classList.remove('hidden');
  applyTheme(); REST.restore();
  if (!tickTimer) tickTimer = setInterval(REST.tick, 250);
  appStarted = true; setTab(STATE.tab || 'today');
}
function registerServiceWorker(){
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  navigator.serviceWorker.register('./service-worker.js').then(reg => {
    reg.addEventListener('updatefound', () => { const nw = reg.installing; nw && nw.addEventListener('statechange', () => {
      if (nw.state === 'installed' && navigator.serviceWorker.controller) toast('App updated – changes apply next time you open it'); }); });
  }).catch(e => console.warn('Service worker registration failed', e));
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (STATE.tab === 'settings') updateStatusLabels(); });
}
(async function init(){
  try {
    await DB.open(); await DB.loadAll(); await seedLibraries();
    applyTheme();
    if (!DB.get('profile', 'main') || !DB.get('appMetadata', 'onboarding')){ $('#boot').classList.add('hidden'); renderOnboarding(); }
    else startApp();
  } catch(e){
    console.error(e);
    $('#boot').innerHTML = `<b>Couldn’t open your data</b>${esc(e && e.message || 'The on-device database is unavailable.')}<br><br>
      If you’re in a private browsing window, open the app normally. Your saved data hasn’t been deleted.<br><br><button class="btn primary" onclick="location.reload()">Try again</button>`;
  }
  registerServiceWorker();
})();
</script>
